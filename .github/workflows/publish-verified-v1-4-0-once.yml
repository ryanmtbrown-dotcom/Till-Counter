name: Publish Exact Verified Till Counter v1.4.0 APK Once
# Owner-requested one-use publication. Previous verified proof:
# Android 7: run 42179843412 (Android 7 functional test passed)
# Android 16: run 42181398458 (Android 16 functional test passed)
# The production app is byte-identical in source to those proof runs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-v1-4-0-once.yml'
permissions:
  contents: write
concurrency:
  group: publish-exact-till-v1-4-0-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ryanmtbrown-dotcom/Till-Counter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify exact release source and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^TILL_VERSION_NAME=//p' gradle.properties)" = "1.4.0"
          bash verify-project.sh
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Match signed APK to the prior Android 16 tested APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          ACTUAL="$(sha256sum "$APK" | cut -d' ' -f1)"
          EXPECTED="ea1090b7904c788c85c745ea146dbff45907f9f6b0fcd377ed389bf8da210b37"
          echo "Rebuilt APK SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo 'Refusing publication: APK differs from the Android 16-tested signed APK.' >&2; exit 1;
          }
          mkdir -p release-out
          cp "$APK" release-out/Till-Counter-v1.4.0.apk
          sha256sum release-out/Till-Counter-v1.4.0.apk > release-out/SHA256.txt
          echo "EXACT_PREVIOUSLY_TESTED_APK_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: till-counter-v1.4.0-verified-apk
          path: |
            release-out/Till-Counter-v1.4.0.apk
            release-out/SHA256.txt
          if-no-files-found: error
          retention-days: 3
      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ryanmtbrown-dotcom/Till-Counter
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.4.0
          APK=release-out/Till-Counter-v1.4.0.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'The version already exists: refusing to overwrite it.' >&2; exit 1;
          fi
          gh release create "$TAG" "$APK" --target main --title "Till Counter $TAG" \
            --notes 'Positive and negative non-cash amounts; 100-note bill straps, 1,000-note bundles, and clearer denomination entry. Exact signed APK matched prior passing Android 7 and Android 16 device proof.'
          mkdir -p roundtrip
          gh release download "$TAG" --pattern 'Till-Counter-v1.4.0.apk' --dir roundtrip
          cmp "$APK" roundtrip/Till-Counter-v1.4.0.apk
          echo RELEASE_ROUNDTRIP_PASS
          gh release list --limit 200 --json tagName --jq '.[].tagName' |
          while IFS= read -r OLD_TAG; do
            [[ -n "$OLD_TAG" && "$OLD_TAG" != "$TAG" ]] || continue
            gh release delete "$OLD_TAG" --yes --cleanup-tag
          done
