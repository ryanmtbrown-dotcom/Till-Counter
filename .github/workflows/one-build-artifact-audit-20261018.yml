name: Prune old Actions artifacts - preserve verified build

on:
  push:
    branches:
      - maintenance/actions-one-build-20261018
    paths:
      - .github/workflows/one-build-artifact-audit-20261018.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve latest verified build and remove older stored artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          EXPECTED_MAIN_SHA="939c47719d82f258ee49b3cf419e576c0b418525"
          KEEP_ID="11688748571"
          KEEP_RUN="38103659822"
          KEEP_NAME="till-counter-proof"
          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$MAIN_SHA" = "$EXPECTED_MAIN_SHA" || { echo "SAFETY STOP: main changed"; exit 1; }
          gh api "repos/$REPO/actions/runs/$KEEP_RUN" --jq '[.conclusion,.head_sha,.head_branch] | @tsv' > "$RUNNER_TEMP/run.tsv"
          test "$(cat "$RUNNER_TEMP/run.tsv")" = "$(printf 'success\t%s\tmain' "$EXPECTED_MAIN_SHA")" || { echo "SAFETY STOP: retained run is not successful current main"; exit 1; }
          test "$(gh api "repos/$REPO/actions/artifacts/$KEEP_ID" --jq '.name')" = "$KEEP_NAME" || { echo "SAFETY STOP: retained artifact missing or wrong name"; exit 1; }
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.size_in_bytes] | @tsv' > "$RUNNER_TEMP/inventory.tsv"
          python3 - "$RUNNER_TEMP/inventory.tsv" "$KEEP_ID" <<'PY'
          import os, subprocess, sys
          rows=[]
          for raw in open(sys.argv[1],encoding="utf-8"):
              parts=raw.rstrip("\n").split("\t")
              if len(parts)!=3: raise SystemExit("SAFETY STOP: unexpected inventory row")
              ident,name,size=parts
              rows.append((int(ident),name,int(size)))
          keep=int(sys.argv[2])
          if len(rows)!=3 or sum(x[0]==keep for x in rows)!=1:
              raise SystemExit(f"SAFETY STOP: inventory changed, found {len(rows)} artifacts")
          older=[x for x in rows if x[0]!=keep]
          print(f"BEFORE: count={len(rows)}, MB={sum(x[2] for x in rows)/1e6:.2f}",flush=True)
          success=[]
          for ident,name,size in older:
              cmd=subprocess.run(["gh","api","--method","DELETE",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{ident}"],capture_output=True,text=True)
              if cmd.returncode: raise SystemExit(f"FAILED DELETE id={ident} name={name}: {cmd.stderr[-400:]}")
              success.append((ident,name,size))
          print(f"DELETED: count={len(success)}, MB={sum(x[2] for x in success)/1e6:.2f}",flush=True)
          remaining=subprocess.run(["gh","api","--paginate",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100","--jq",".artifacts[] | [.id,.name,.size_in_bytes] | @tsv"],capture_output=True,text=True,check=True).stdout.splitlines()
          if len(remaining)!=1 or int(remaining[0].split("\t")[0])!=keep:
              raise SystemExit(f"SAFETY STOP: verification mismatch {remaining}")
          print(f"VERIFIED: remaining_artifacts=1, retained_id={keep}, artifact={remaining[0]}",flush=True)
          PY
