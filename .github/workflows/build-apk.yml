name: Build Till Counter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$SOURCE"

          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          test -n "$VERSION"

          mkdir -p release

          APK="Till-Counter-v${VERSION}.apk"
          cp "$SOURCE" "release/$APK"

          test -s "release/$APK"

          sha256sum "release/$APK" | tee "release/$APK.sha256"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Till-Counter-v${{ env.VERSION }}-APK
          path: |
            release/${{ env.APK }}
            release/${{ env.APK }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release/$APK" \
              "release/$APK.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "release/$APK" \
              "release/$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "Till Counter $TAG" \
              --notes "Till Counter Android build $TAG."
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG"

          COUNT="$(gh release view "$TAG" \
            --json assets \
            --jq "[.assets[] | select(.name == \"$APK\")] | length")"

          test "$COUNT" = "1"

          rm -rf verify-release
          mkdir verify-release

          gh release download "$TAG" \
            --pattern "$APK" \
            --dir verify-release

          test -s "verify-release/$APK"

          cmp "release/$APK" "verify-release/$APK"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "Commit: $GITHUB_SHA"
            echo
            echo "APK output:"
            find app/build/outputs -type f -print 2>/dev/null || true
            echo
            echo "Release staging:"
            find release -type f -print 2>/dev/null || true
          } > diagnostics/build-diagnostics.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Till-Counter-build-failure
          path: diagnostics/
          if-no-files-found: ignore
