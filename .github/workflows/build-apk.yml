name: Build and Prove Till Counter APK
on:
  push:
    branches: [main, premium-calculator-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android16_only:
        description: 'Reuse previously passed Android 7 proof and rerun Android 16/release gates only'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android 36 environment
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify clean project
        run: bash verify-project.sh
      - name: Build signed APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile Android 16 instrumentation proof
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -Fq 'classes.dex' apk-contents.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump resources "$APK" > apk-resources.txt
          grep -Fq 'drawable/splash' apk-resources.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -Fq "package: name='com.tillcounter.app'" apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" apk-badging.txt
          grep -Fq "sdkVersion:'24'" apk-badging.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 7 compatibility functional test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.android16_only != true }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-test.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve Android 7 proof
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.android16_only != true }}
        run: |
          mv start.txt start-api24.txt
          mv device.log device-api24.log
          mv final-screen.png final-screen-api24.png
      - name: Android 16 complete functional test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            gradle --no-daemon :app:connectedDebugAndroidTest
            echo INSTRUMENTATION_ANDROID16_PASS > start.txt
            adb logcat -d -v threadtime > device.log
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\\.tillcounter\\.app' device.log; then cat device.log; exit 1; fi
            adb exec-out screencap -p > final-screen.png
      - name: Prepare exact tested APK
        shell: bash
        run: |
          set -euo pipefail
          V="$(sed -n 's/^TILL_VERSION_NAME=//p' gradle.properties)"
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk "release-out/Till-Counter-v${V}.apk"
          sha256sum "release-out/Till-Counter-v${V}.apk" | tee release-out/SHA256.txt
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: till-counter-proof
          if-no-files-found: warn
          path: |
            apk-contents.txt
            apk-signature.txt
            apk-badging.txt
            apk-resources.txt
            start-api24.txt
            device-api24.log
            final-screen-api24.png
            start.txt
            device.log
            final-screen.png
            release-out/SHA256.txt
      - name: Publish only after all proof gates pass
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V="$(sed -n 's/^TILL_VERSION_NAME=//p' gradle.properties)"
          TAG="v$V"; APK="release-out/Till-Counter-v${V}.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Till Counter $TAG" --notes 'Clean native rebuild. Complete Android 16 functional workflow passed before publication.'
          mkdir roundtrip
          gh release download "$TAG" --pattern "Till-Counter-v${V}.apk" --dir roundtrip
          cmp "$APK" "roundtrip/Till-Counter-v${V}.apk"
          echo RELEASE_ROUNDTRIP_PASS
