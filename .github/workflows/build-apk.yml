name: Build Till Counter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Collect build diagnostics
        if: failure()
        run: |
          mkdir -p build-diagnostics
          find . -type f \( -name '*.log' -o -name '*.txt' -o -name '*.html' \) -path '*/build/*' -print -exec cp --parents {} build-diagnostics/ \; || true
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Till-Counter-Build-Diagnostics
          path: build-diagnostics
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Till-Counter-v0.1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
