<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Till Counter</title><link rel="icon" href="data:,"><link rel="stylesheet" href="app.css"></head><body>
<div id="splash" class="splash"><img src="splash.png" alt="Till Counter"><div class="splash-progress"><div id="splashBar"></div></div></div>
<main id="app" class="app hidden"><header><button id="back" class="ghost">‹ Back</button><div><div class="eyebrow">TILL COUNTER</div><h1 id="title">Store Charges</h1></div><div id="step" class="step"></div></header>
<section id="moneyStage" class="stage"><div class="total-card"><span>Running total</span><strong id="running">$0.00</strong></div><div id="entries" class="entries"></div><div class="display" id="display">$0.00</div><div id="moneyPad" class="keypad"></div><div class="actions"><button id="add" class="secondary">+ Add</button><button id="next" class="primary">Next</button></div></section>
<section id="cashStage" class="stage hidden"><div class="denom-card"><span id="denomLabel">$100 bills</span><strong id="cashDisplay">0</strong><small id="denomCalc">0 × $100.00 = $0.00</small></div><div id="cashPad" class="keypad"></div><div class="actions"><button id="cashPrev" class="secondary">Previous</button><button id="cashNext" class="primary">Next</button></div></section>
<section id="summaryStage" class="stage hidden"><div class="summary-hero"><span>COUNT COMPLETE</span><strong id="grandTotal">$0.00</strong><small>Total represented on this till sheet</small></div><div id="summary"></div><div class="actions"><button id="editCount" class="secondary">Edit Count</button><button id="newTill" class="primary">New Till</button></div></section>
</main><script src="app.js"></script></body></html>
